; Compile the Freenove ESP32-S3-WROOM I2C / SSD1306 configuration: pio run
; Compile another variant explicitly: pio run -e <environment>
; Upload only after matching the OLED and confirming its wiring:
; pio run -e <matching_environment> -t upload --upload-port <ESP32_port>
; Serial: pio device monitor -p <ESP32_port> -b 921600
[platformio]
src_dir = Visor_OLED_Test
boards_dir = boards
default_envs = i2c_ssd1306_mirror

[env]
platform = espressif32@6.10.0
board = freenove_esp32_s3_wroom_n16r8
framework = arduino
lib_deps = olikraus/U8g2@2.36.18
monitor_speed = 921600
upload_protocol = esptool
upload_speed = 921600
; Use the board's CH343 USB-UART connector for reliable Pi operation. With the
; antenna at the top and both USB-C sockets at the bottom, this is the RIGHT
; socket under BOOT. Arduino Serial then uses UART0 at 921600 baud.

[env:spi_ssd1306]
build_flags =
    -DUSE_SPI=1
    -DUSE_SH1106=0
    -DMIRROR_TEXT=0

[env:spi_sh1106]
build_flags =
    -DUSE_SPI=1
    -DUSE_SH1106=1
    -DMIRROR_TEXT=0

[env:i2c_ssd1306]
build_flags =
    -DUSE_SPI=0
    -DUSE_SH1106=0
    -DMIRROR_TEXT=0

[env:i2c_sh1106]
build_flags =
    -DUSE_SPI=0
    -DUSE_SH1106=1
    -DMIRROR_TEXT=0

[env:spi_ssd1306_mirror]
build_flags =
    -DUSE_SPI=1
    -DUSE_SH1106=0
    -DMIRROR_TEXT=1

[env:spi_sh1106_mirror]
build_flags =
    -DUSE_SPI=1
    -DUSE_SH1106=1
    -DMIRROR_TEXT=1

[env:i2c_ssd1306_mirror]
build_flags =
    -DUSE_SPI=0
    -DUSE_SH1106=0
    -DMIRROR_TEXT=1

[env:i2c_sh1106_mirror]
build_flags =
    -DUSE_SPI=0
    -DUSE_SH1106=1
    -DMIRROR_TEXT=1
